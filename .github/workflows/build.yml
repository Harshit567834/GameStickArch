name: Build and Release GameStickArch Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Ensure qemu-arm-static binary exists for chroot
        run: |
          if [ ! -f /usr/bin/qemu-arm-static ]; then
            wget -q https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-arm-static
            chmod +x qemu-arm-static
            sudo mv qemu-arm-static /usr/bin/
          fi

      - name: Install apt dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y parted dosfstools e2fsprogs libarchive-tools zip

      - name: Build Image
        run: |
          sudo bash -x build_image.sh > build_log.txt 2>&1 || {
            cat build_log.txt
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add build_log.txt
            git commit -m "Upload build log"
            git push origin HEAD:main
            exit 1
          }

      - name: Prepare Release Zip
        run: |
          mkdir -p GameStickArch_Release/ESP32_Wireless_Terminal
          mkdir -p GameStickArch_Release/PC_Terminal_GUI
          mv GameStickArch.img GameStickArch_Release/
          cp ESP32_Wireless_Terminal/ESP32_Wireless_Terminal.ino GameStickArch_Release/ESP32_Wireless_Terminal/
          cp PC_Terminal_GUI/GameStick_Console.py GameStickArch_Release/PC_Terminal_GUI/
          cd GameStickArch_Release
          zip -r9 ../GameStickArch_Release.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStickArch-Release-Zip
          path: GameStickArch_Release.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GameStickArch_Release.zip
          name: "GameStickArch ${{ github.ref_name }}"
          body: |
            ### GameStickArch Custom Image
            
            This release contains the pre-compiled `.img` file, the `ESP32_Wireless_Terminal.ino` sketch, and the `GameStick_Console.py` GUI tool.
            
            **Instructions:**
            1. Extract `GameStickArch_Release.zip`
            2. Flash `GameStickArch.img` to your GameStick SD card.
            3. Flash `ESP32_Wireless_Terminal.ino` to your ESP32.
            4. Solder/Connect the ESP32 (TX, RX, GND) to the GameStick UART pins.
            5. Connect your PC to the `GameStick-Terminal` Wi-Fi.
            6. Run `python GameStick_Console.py` to instantly access the GameStick root shell wirelessly!
          draft: false
          prerelease: false
